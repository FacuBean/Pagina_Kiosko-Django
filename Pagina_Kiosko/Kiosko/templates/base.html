<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Kiosco{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }

        header, footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }

        main {
            padding: 40px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .center {
            text-align: center;
            margin-left: 10px;
        }
        .boton {
        display: inline-block;
        padding: 10px 20px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.3s ease;
        margin-top: 10px; /* Espacio superior */
        margin-right: 10px; /* Espacio entre los botones */
        }

        .boton:hover {
            background-color: #0056b3;
        }

        .botones-contenedor {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Kiosco</h1>
        <nav>
            <a href="{% url 'home' %}">Inicio</a> |
            <a href="{% url 'lista_productos' %}">Productos</a> |
            <a href="{% url 'lista_ventas' %}">Ventas</a> |
            <a href="{% url 'lista_clientes' %}">Clientes</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2025 Kiosco Facu</p>
    </footer>
</body>
</html>
