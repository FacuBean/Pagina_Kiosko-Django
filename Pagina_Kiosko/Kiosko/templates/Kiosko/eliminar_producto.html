{% extends 'base.html' %}

{% block content %}
    <h2>Eliminar Producto</h2>
    <p>¿Estás seguro que querés eliminar "{{ object.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_productos' %}">Cancelar</a>
    </form>
{% endblock %}
