{% extends 'base.html' %}

{% block title %}Lista de Clientes{% endblock %}

{% block content %}
<h2>Lista de Clientes</h2>

<table>
    <thead>
        <tr>
            <th>Nombre</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.username }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="center">No hay clientes cargados.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="botones-contenedor">
    <a href="{% url 'agregar_cliente' %}" class="boton">Agregar Cliente</a>
    <a href="{% url 'buscar_cliente' %}" class="boton">Buscar Cliente</a>
</div>
{% endblock %}
