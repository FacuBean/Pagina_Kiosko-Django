{% extends 'Kiosko/base.html' %}

{% block content %}
  <h1>Eliminar Producto</h1>

  <p>¿Estás seguro de que quieres eliminar el producto "{{ object.nombre_producto }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_productos' %}">Cancelar</a>
  </form>
{% endblock %}
